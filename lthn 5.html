<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
        table.names {
            width: 100%;
            background-color: #f1f1c1;
        }
    </style>
</head>
<body>
    <table style="width: 100%">
        <tr>
            <th>first Name</th>
            <th>last Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
    </table>
    <br>
    <table class="names">
        <tr>
            <th>first Name</th>
            <th>last Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Jill</td>
            <td>Smith</td>
            <td>50</td>
        </tr>
</body>
</html>
